name: Meilleure vente 3GWIN (horaire)
on:
  schedule:
    - cron: "0 6-20 * * 1-6"   # toutes les heures, 6h-20h UTC (~8h-22h Paris), lun-sam
  workflow_dispatch:            # bouton "Run" manuel
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape 3GWIN -> meilleure_vente.json
        env:
          GWIN_VENTES_URL: ${{ secrets.GWIN_VENTES_URL }}
        run: python scrape_meilleure_vente.py
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meilleure_vente.json
          git diff --staged --quiet || git commit -m "MAJ meilleure vente du jour [auto]"
          git push

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mes Résultats · SFR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --sfr:#E2001A;--sfr-dark:#A8001A;
  --pro:#0F0F1E;--pro2:#1A1A2E;--pro3:#252548;
  --off:#F4F4F7;--white:#FFF;--border:#E2E2EA;
  --text:#0F0F1E;--muted:#666;--light:#6B7280;
  --green:#00A651;--green-bg:#E6F7EE;--green-dk:#006633;
  --amber:#D97706;--amber-bg:#FEF3C7;--amber-dk:#92400E;
  --orange:#EA580C;--orange-bg:#FFF0E8;--orange-dk:#9A3412;
  --safe:env(safe-area-inset-bottom,16px);
}
html,body{height:100%;background:var(--off);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;color:var(--text);overflow-x:hidden}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}
/* Tablette / grand mobile : cadre type téléphone centré */
@media(min-width:540px) and (max-width:899px){
  html,body{background:#0A0A14}
  .screen{max-width:480px;margin-inline:auto;box-shadow:0 0 80px rgba(0,0,0,.55)}
}
/* PC : vraie mise en page large (2 colonnes + items sur 5 de front) */
@media(min-width:900px){
  .screen{max-width:none;margin:0}
  #dash .header{padding-left:max(1.25rem,calc((100vw - 1140px)/2 + 1.25rem));padding-right:max(1.25rem,calc((100vw - 1140px)/2 + 1.25rem))}
  .body{max-width:1140px;margin-inline:auto;width:100%;padding:1rem 1.25rem calc(1.25rem + var(--safe))}
  .dash-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:1rem;align-items:start;margin-top:.25rem}
  .col-main,.col-side{display:flex;flex-direction:column;gap:.9rem}
  .col-main>*,.col-side>*{margin-bottom:0!important}
  .col-side .sec{padding-top:0}
  .items-block{margin-top:1rem}
  .body .items-grid{grid-template-columns:repeat(5,1fr)}
  /* l'item orphelin reprend sa cellule normale en 5 colonnes */
  .body .items-grid > .item-c:last-child:nth-child(odd){grid-column:auto}
  .body .statut{margin-bottom:0}
}

/* ── LOGIN ── */
#login{background:var(--pro);justify-content:flex-end}
.login-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem}
.sfr-logo{width:80px;height:80px;background:var(--sfr);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;flex-shrink:0}
.sfr-logo span{font-size:22px;font-weight:900;color:#fff;letter-spacing:-1px}
.lt-h{font-size:26px;font-weight:800;color:#fff;text-align:center;letter-spacing:-.5px}
.lt-s{font-size:13px;color:rgba(255,255,255,.4);text-align:center;margin-top:5px}
.login-card{background:#fff;border-radius:28px 28px 0 0;padding:2rem 1.5rem calc(1.5rem + var(--safe))}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
.field-inp{width:100%;padding:15px 16px;border:2px solid var(--border);border-radius:13px;font-size:17px;font-family:inherit;background:var(--off);color:var(--text);outline:none;transition:border-color .2s;margin-bottom:1.25rem}
.field-inp:focus{border-color:var(--sfr);background:#fff}
.pin-row{display:flex;gap:10px;margin-bottom:1.5rem}
.pin-d{flex:1;min-width:0;width:100%;height:62px;border:2px solid var(--border);border-radius:13px;font-size:28px;font-weight:800;text-align:center;background:var(--off);color:var(--text);outline:none;transition:all .2s;-webkit-appearance:none;font-family:inherit}
.pin-d:focus{border-color:var(--sfr);background:#fff}
.btn-main{width:100%;padding:17px;background:var(--sfr);color:#fff;border:none;border-radius:13px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;transition:background .15s}
.btn-main:active{background:var(--sfr-dark)}
.btn-main:disabled{background:#CCC}
.login-err{margin-top:1rem;padding:12px;background:#FFF0F0;color:var(--sfr);border-radius:10px;font-size:13px;font-weight:600;text-align:center;display:none}

/* ── LOADING ── */
#loading{align-items:center;justify-content:center;gap:1rem}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--sfr);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:14px;color:var(--muted)}

/* ── HEADER ── */
.header{background:var(--sfr);padding:50px 1.25rem .9rem;position:sticky;top:0;z-index:10}
.h-row{display:flex;justify-content:space-between;align-items:flex-start}
.h-name{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.3px}
.h-boutique{font-size:12px;color:rgba(255,255,255,.6);margin-top:3px;font-weight:500}
.h-logout{background:rgba(255,255,255,.15);border:none;color:#fff;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.h-pills{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.h-pill{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,.85);font-weight:600;letter-spacing:.3px}

/* ── BODY ── */
.body{flex:1;overflow-y:auto;padding:.75rem .75rem calc(1rem + var(--safe))}
.sec{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:.75rem .2rem .4rem}

/* ── STATUT ── */
.statut{border-radius:14px;padding:13px 1rem;margin-bottom:.75rem;display:flex;align-items:center;gap:12px}
.st-great{background:linear-gradient(135deg,var(--green-dk),var(--green))}
.st-ok{background:linear-gradient(135deg,#1565C0,#1976D2)}
.st-warn{background:linear-gradient(135deg,#B45309,var(--amber))}
.st-bad{background:linear-gradient(135deg,var(--sfr-dark),var(--sfr))}
.st-icon{font-size:26px;flex-shrink:0}
.st-txt h3{font-size:15px;font-weight:800;color:#fff}
.st-txt p{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px}

/* ── COMMISSION HERO ── */
.comm-hero{background:var(--pro);border-radius:16px;padding:1.25rem;margin-bottom:.75rem}
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.ch-block{background:var(--pro2);border-radius:12px;padding:1rem}
.chb-lbl{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:5px}
.chb-val{font-size:28px;font-weight:900;color:#fff;letter-spacing:-1.5px;line-height:1}
.chb-val sup{font-size:13px;font-weight:400;opacity:.45}
.chb-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:4px}
.ch-block.proj{border:1.5px solid rgba(226,0,26,.4)}
.ch-block.proj .chb-lbl{color:rgba(255,120,120,.55)}
.ch-block.proj .chb-val{color:#FF9090}

/* Commission nette avec malus */
.comm-nette{background:var(--pro3);border-radius:12px;padding:1rem}
.cn-lbl{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:5px}
.cn-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cn-val{font-size:36px;font-weight:900;color:#fff;letter-spacing:-2px;line-height:1}
.cn-val sup{font-size:16px;font-weight:400;opacity:.5}
.cn-malus{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(226,0,26,.25);color:#FF9090}
.cn-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:6px}

/* ── JAUGE PALIER ── */
.palier-card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:.75rem}
.pc-top{display:flex;justify-content:space-between;align-items:center;padding:1rem 1rem .75rem}
.pc-tl{font-size:13px;font-weight:700;color:var(--text)}
.pc-pct{font-size:24px;font-weight:900;color:var(--sfr)}
.palier-bar-bg{height:8px;background:var(--border);margin:0 1rem;border-radius:10px;overflow:hidden}
.palier-bar-fill{height:100%;background:var(--sfr);border-radius:10px;transition:width 1s ease}
.palier-labels{display:flex;justify-content:space-between;padding:.4rem 1rem .75rem;font-size:10px;color:var(--light)}
.palier-next{background:var(--off);border-top:1px solid var(--border);padding:.75rem 1rem}
.pn-txt{font-size:13px;color:var(--text);line-height:1.5}
.pn-txt strong{color:var(--sfr)}

/* ── ITEMS ── */
.items-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem}
/* 5ᵉ item orphelin → pleine largeur au lieu d'une cellule vide */
.items-grid > .item-c:last-child:nth-child(odd){grid-column:1 / -1}
.item-c{background:#fff;border:1px solid var(--border);border-radius:14px;padding:.9rem;position:relative}
.item-c.item-ok{border-color:#86EFAC}
.item-c.item-bad{border-color:#FCA5A5}
/* Micro-célébration : item dont la projection atteint/dépasse l'objectif */
@keyframes badgePop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
@keyframes okPulse{0%{box-shadow:0 0 0 0 rgba(0,166,81,.35)}70%{box-shadow:0 0 0 7px rgba(0,166,81,0)}100%{box-shadow:0 0 0 0 rgba(0,166,81,0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.item-c.item-ok{animation:okPulse 1.8s ease-out .3s 2}
.ic-pct-badge.b-great{display:inline-block;animation:badgePop .5s cubic-bezier(.34,1.56,.64,1) both}
/* Entrée en fondu douce des blocs (statut, colonnes, items, refresh) */
#dash-body > *{animation:cardIn .45s ease both}
#dash-body > *:nth-child(2){animation-delay:.06s}
#dash-body > *:nth-child(3){animation-delay:.12s}
#dash-body > *:nth-child(4){animation-delay:.18s}
/* Respect des préférences d'accessibilité */
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.ic-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
.ic-icon{font-size:20px}
.ic-pct-badge{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px}
/* ≥100% = vert (réussite), 75-99 = ambre (tout proche), 50-74 = orange, <50 = rouge */
.b-great{background:var(--green-bg);color:var(--green-dk)}
.b-ok{background:var(--amber-bg);color:var(--amber-dk)}
.b-warn{background:var(--orange-bg);color:var(--orange-dk)}
.b-bad{background:#FEE2E2;color:var(--sfr-dark)}
.ic-name{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-bottom:.45rem;line-height:1.3}
.ic-proj-cap{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:2px;text-align:right}
.prog-bg{height:4px;background:var(--border);border-radius:10px;margin-bottom:.45rem;overflow:hidden}
.prog-fill{height:100%;border-radius:10px;transition:width .8s}
.pf-great{background:var(--green)}
.pf-ok{background:var(--amber)}
.pf-warn{background:var(--orange)}
.pf-bad{background:var(--sfr)}
.iv-r.green{color:var(--green-dk)}
.ic-vals{display:flex;flex-direction:column;gap:3px}
.iv{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.iv-l{font-size:10px;color:var(--light);flex-shrink:0}
.iv-r{font-size:12px;font-weight:700;color:var(--text);text-align:right}
.iv-r.red{color:var(--sfr)}
/* Indicateur malus */


/* ── PRÉSENCE ── */
.pres-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:.75rem}
.pres-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
.pres-lbl{font-size:13px;font-weight:700}
.pres-val{font-size:24px;font-weight:900;color:var(--pro)}
.pres-sub{font-size:11px;color:var(--muted);margin-bottom:.5rem}
.pres-bar{height:5px;background:var(--border);border-radius:10px;overflow:hidden}
.pres-fill{height:100%;background:var(--sfr);border-radius:10px}

/* ── REFRESH ── */
.refresh{text-align:center;padding:1rem;font-size:11px;color:var(--light);display:flex;align-items:center;justify-content:center;gap:6px}
.live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── CHALLENGE ── */
.chall-card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:.75rem}
.chall-hdr{background:linear-gradient(135deg,#1E40AF,#7C3AED);padding:.9rem 1rem;display:flex;align-items:center;justify-content:space-between}
.chall-hdr-left{display:flex;align-items:center;gap:10px}
.chall-icon{font-size:22px}
.chall-title{font-size:13px;font-weight:800;color:#fff}
.chall-sub{font-size:10px;color:rgba(255,255,255,.6);margin-top:1px}
.chall-badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:10px;color:#fff}
.chall-badge.won{background:rgba(0,166,81,.4)}
.chall-badge.pending{background:rgba(255,255,255,.15)}
.chall-mois-sel{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 10px;color:#fff;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;outline:none}
.chall-mois-sel option{background:#1E40AF;color:#fff}
.chall-body{padding:1rem}
.chall-stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem}
.chall-stat{text-align:center;background:var(--off);border-radius:10px;padding:.6rem}
.chall-stat-val{font-size:22px;font-weight:900;color:var(--text)}
.chall-stat-lbl{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.chall-bar-bg{height:6px;background:var(--border);border-radius:10px;overflow:hidden;margin-bottom:.5rem}
.chall-bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#2563EB,#7C3AED);transition:width .8s ease}
.chall-hist{margin-top:.5rem}
.chall-day{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F1F5F9;font-size:11px}
.chall-day:last-child{border-bottom:none}
.chall-day-date{font-weight:700;color:var(--text);min-width:40px}
.chall-day-rank{font-size:10px;color:var(--muted)}
.chall-day-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px}
.chall-day-badge.w{background:#ECFDF5;color:#065F46}
.chall-day-badge.l{background:#FEF2F2;color:var(--sfr-dark)}

/* ── TOTAL ESTIMÉ ── */
.total-estime{background:linear-gradient(135deg,#065F46,var(--green));border-radius:12px;padding:1rem;margin-top:.75rem}
.te-lbl{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:4px}
.te-val{font-size:32px;font-weight:900;color:#fff;letter-spacing:-1.5px;line-height:1}
.te-val sup{font-size:14px;font-weight:400;opacity:.5}
.te-detail{font-size:10px;color:rgba(255,255,255,.5);margin-top:6px}

/* ── REFRESH BTN ── */
.h-refresh{background:rgba(255,255,255,.15);border:none;color:#fff;min-width:40px;min-height:40px;border-radius:20px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.h-logout{min-height:40px}
.h-refresh.spinning{animation:spin .7s linear infinite}

/* ── ERREUR ── */
.err-wrap{padding:2rem 1rem;text-align:center}
.err-icon{font-size:40px;margin-bottom:1rem}
.err-title{font-size:16px;font-weight:700;margin-bottom:.5rem}
.err-msg{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:1.5rem}
</style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="login" class="screen active">
  <div class="login-top">
    <div class="sfr-logo"><span>SFR</span></div>
    <div class="lt-h">Mes Résultats</div>
    <div class="lt-s" id="login-mois">Groupe Garcia</div>
  </div>
  <div class="login-card">
    <span class="lbl">Prénom</span>
    <input class="field-inp" type="text" id="inp-prenom" placeholder="Ton prénom" autocomplete="off" autocapitalize="words" />
    <span class="lbl">Code d'accès</span>
    <div class="pin-row">
      <input class="pin-d" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
      <input class="pin-d" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
      <input class="pin-d" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
      <input class="pin-d" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
    </div>
    <button class="btn-main" id="btn-login" onclick="tryLogin()">Accéder →</button>
    <div class="login-err" id="login-err">Prénom ou code incorrect</div>
  </div>
</div>

<!-- ═══════ LOADING ═══════ -->
<div id="loading" class="screen">
  <div class="spinner"></div>
  <div class="load-txt">Chargement de vos données…</div>
</div>

<!-- ═══════ DASHBOARD ═══════ -->
<div id="dash" class="screen">
  <div class="header">
    <div class="h-row">
      <div>
        <div class="h-name" id="h-name">—</div>
        <div class="h-boutique" id="h-boutique">—</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="h-refresh" id="h-refresh" onclick="if(currentAuth)loadData(currentAuth,true)" title="Actualiser">↻</button>
        <button class="h-logout" onclick="doLogout()">Déconnexion</button>
      </div>
    </div>
    <div class="h-pills">
      <span class="h-pill" id="h-mois">Avril 2026</span>
      <span class="h-pill" id="h-jour">—</span>
      <span class="h-pill" id="h-maj">—</span>
    </div>
  </div>
  <div class="body" id="dash-body"></div>
</div>

/* ════════════════════════════════════════
   CALCULS
════════════════════════════════════════ */

// Commission brute sur marge selon paliers
function commBrute(marge) {
  for (let i = PALIERS.length - 1; i >= 0; i--) {
    if (marge >= PALIERS[i].min) return Math.round(marge * PALIERS[i].pct);
  }
  return 0;
}

// Palier actuel
function palierActuel(marge) {
  for (let i = PALIERS.length - 1; i >= 0; i--) {
    if (marge >= PALIERS[i].min) return PALIERS[i];
  }
  return PALIERS[0];
}

// Prochain palier
function prochainPalier(marge) {
  for (let p of PALIERS) {
    if (marge < p.max && p.pct > 0 && marge < p.min + (p.max - p.min)) {
      if (marge < p.min) return { reste: Math.round(p.min - marge), palier: p };
      if (marge < p.max) {
        // dans ce palier, prochain = palier suivant
        const idx = PALIERS.indexOf(p);
        if (idx < PALIERS.length - 1 && PALIERS[idx+1].max !== Infinity) {
          return { reste: Math.round(PALIERS[idx+1].min - marge), palier: PALIERS[idx+1] };
        }
      }
    }
  }
  // chercher le prochain palier non encore atteint
  for (let p of PALIERS) {
    if (marge < p.min) return { reste: Math.round(p.min - marge), palier: p };
  }
  return null;
}


// items_atteints = nb items à 100%+
function commNette(commBr, itemsAtteints, totalItems) {
  // 5/5 = 100% de la commission
  // chaque item non atteint = -20%
  // ex: 3/5 atteints = 2 ratés = -40% = 60% de la commission
  const ratés = Math.max(0, totalItems - itemsAtteints);
  const pctRetenu = Math.max(0, 100 - ratés * 20);
  return { nette: Math.round(commBr * pctRetenu / 100), malus: 100 - pctRetenu, ratés, pctRetenu };
}

/* ════════════════════════════════════════
   GOOGLE SHEET FETCH (CSV + retry)
════════════════════════════════════════ */
async function fetchRetry(url, retries=3, delay=1000){
  for(let i=0;i<=retries;i++){
    try{
      const r=await fetch(url);
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.text();
    }catch(e){
      if(i===retries) throw e;
      await new Promise(ok=>setTimeout(ok,delay*(i+1)));
    }
  }
}

function parseCSV(text){
  const lines=text.split('\n').filter(l=>l.trim());
  if(lines.length<2) return [];
  const hdr=lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line=>{
    const vals=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ}
      else if(c===','&&!inQ){vals.push(cur.replace(/^"|"$/g,'').trim());cur=''}
      else{cur+=c}
    }
    vals.push(cur.replace(/^"|"$/g,'').trim());
    const obj={};
    hdr.forEach((h,i)=>{
      const key=COL[h]||h;
      let v=vals[i]||'';
      // Parse dates Google Sheets
      if(v.match(/^Date\(/)){
        const p=v.slice(5,-1).split(',');
        const d=new Date(+p[0],+p[1],+(p[2]||1));
        const M=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
        v=key==='derniereMaj'?d.toLocaleDateString('fr-FR'):M[d.getMonth()]+' '+d.getFullYear();
      }
      obj[key]=v;
    });
    return obj;
  });
}

async function fetchSheet(sheet){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}`;
  const text=await fetchRetry(url);
  return parseCSV(text);
}

function norm(s){ return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function getPin(){ return pins.map(p=>p.value).join(''); }
let currentAuth = null;

// Mois courant inject\u00e9 dynamiquement sur la page login (la pill header est g\u00e9r\u00e9e par cfg.moisEnCours)

let CACHED_DATA = null;
let LAST_REFRESH = 0;

function loadData(auth, silent) {
  if (!silent) showScreen('loading');
  Promise.all([
    fetchSheet('Données_Commissions'),
    fetchSheet('Items_Mois'),
    fetchSheet('Config'),
    fetchSheet('Historique_Challenges').catch(()=>[])
  ])
    .then(([donnees, items, config, challenges]) => {
      CACHED_DATA = { donnees, items, config, challenges };
      LAST_REFRESH = Date.now();
      renderDash(auth, donnees, items, config, challenges);
    })
    .catch(e => {
      if (silent && CACHED_DATA) {
        // Refresh silencieux échoué — garder les données en cache
        return;
      }
      showScreen('dash');
      document.getElementById('dash-body').innerHTML = `

   RENDER

function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }
function pct(real, obj){ return obj > 0 ? Math.min(Math.round(real/obj*100), 200) : (real>0?100:0); }
function badgeClass(p){ return p>=100?'b-great':p>=75?'b-ok':p>=50?'b-warn':'b-bad'; }
function fillClass(p){ return p>=100?'pf-great':p>=75?'pf-ok':p>=50?'pf-warn':'pf-bad'; }

function renderDash(auth, donnees, items, config, challenges) {
  challenges = challenges || [];
  // Trouver le vendeur dans le Sheet
  const nomSheet = auth.nomSheet;
  const v = donnees.find(d => d.nom && d.nom.toUpperCase().trim() === nomSheet.toUpperCase());

  if (!v) {
    showScreen('dash');
    document.getElementById('dash-body').innerHTML = `
      <div class="err-wrap">
        <div class="err-icon">🔍</div>
        <div class="err-title">Données introuvables</div>
        <div class="err-msg">Aucune donnée pour ${nomSheet}.<br>Contactez votre manager.</div>
        <button class="btn-main" style="width:auto;padding:12px 24px" onclick="doLogout()">Retour</button>
      </div>`;
    return;
  }

  // Config
  const cfg = config[0] || {};
  const moisFallback = (function(){const M=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];const d=new Date();return M[d.getMonth()]+' '+d.getFullYear();})();
  const moisLabel = cfg.moisEnCours || moisFallback;
  const majDate   = cfg.derniereMaj || '';
  const boutique  = BOUTIQUES[v.codeBoutique] || v.codeBoutique || '';

  // Données brutes
  const marge     = parseFloat(v.margeRealisee) || 0;
  const jourOuvre = parseInt(v.jourOuvre) || 1;
  const nbJours   = parseInt(v.nbJoursOuvres) || 22;
  const joursTrav = parseInt(v.joursTravailles) || nbJours;
  const nbMob     = parseFloat(v.nbMobiles) || 0;
  const nbG3A     = parseFloat(v.nbGaranties) || 0;
  const nbCyber   = parseFloat(v.nbCyber) || 0;
  const nbAssu    = parseFloat(v.nbAssurances) || 0;
  const nbMobAssu = parseFloat(v.nbMobilesAssu) || nbMob || 1;
  const caAcc     = parseFloat(v.caAcc) || 0;
  const txAssu    = nbMobAssu > 0 ? Math.round((nbAssu / nbMobAssu) * 100) : 0;
  const txG3A     = nbMob > 0 ? Math.round((nbG3A / nbMob) * 100) : 0;
  const accParMob = nbMob > 0 ? Math.round(caAcc / nbMob) : 0;

  // Coefficient de projection (basé sur jours passés vs jours présence)
  const coef = jourOuvre > 0 && joursTrav > 0 ? joursTrav / jourOuvre : 1;

  // ── MARGE PROJETÉE ──
  const margeProj = Math.round(marge * coef);

  // ── ITEMS : réalisé & projeté ──
  const itemsDefs = items.filter(it => it.nomItem);

  // Map réel + projeté par item
  const realMap = {
    'Mobiles':              { real: nbMob,     proj: Math.round(nbMob*coef),     icon:'📱', unite:'unités' },
    'Garantie 3ème Année':  { real: txG3A,     proj: txG3A,                      icon:'🛡️', unite:'%' },
    'SFR Cyber':            { real: nbCyber,   proj: Math.round(nbCyber*coef),   icon:'🔒', unite:'unités' },
    "Taux d'Assurance":     { real: txAssu,    proj: txAssu,                     icon:'⚡', unite:'%' },
    "Taux d'Accessoire":    { real: accParMob, proj: accParMob,                  icon:'🎧', unite:'€/mob' },
  };

  // Items atteints (réalisé ≥ objectif)
  let itemsAtteints = 0;
  const totalItems = itemsDefs.length || 5;

  itemsDefs.forEach(it => {
    const r = realMap[it.nomItem];
    const obj = parseFloat(it.objectif) || 1;
    // Malus basé sur la PROJECTION fin de mois
    if (r && r.proj >= obj) itemsAtteints++;
  });

  // ── COMMISSIONS ──
  const commBrR = commBrute(marge);       // sur réalisé actuel
  const commBrP = commBrute(margeProj);   // sur marge projetée
  const palierP = palierActuel(margeProj);
  const { nette: commNetteP, malus: malusPct, ratés } = commNette(commBrP, itemsAtteints, totalItems);
  const next = prochainPalier(margeProj);

  // Progression dans le palier projeté
  const palierMin = palierP.min;
  const palierMax = palierP.max === Infinity ? palierMin + 1000 : palierP.max;
  const progPalier = Math.min(Math.round(((margeProj - palierMin) / (palierMax - palierMin)) * 100), 100);

  // Statut global
  const avgPct = itemsDefs.length > 0
    ? Math.round(itemsDefs.map(it => {
        const r = realMap[it.nomItem]; const obj = parseFloat(it.objectif)||1;
        return r ? pct(r.real, obj) : 0;
      }).reduce((a,b)=>a+b,0) / itemsDefs.length)
    : 50;

  let stClass, stIcon, stH, stP;
  if (avgPct>=100){stClass='st-great';stIcon='🏆';stH='Objectifs atteints !';stP='Commission pleine, 0 malus — excellent !'}
  else if(avgPct>=75){stClass='st-ok';stIcon='✅';stH='En bonne voie';stP='Maintiens ce rythme jusqu\'à la fin du mois'}
  else if(avgPct>=40){stClass='st-warn';stIcon='⚡';stH='À accélérer';stP='Chaque item non atteint = -20% de commission'}
  else{stClass='st-bad';stIcon='🚨';stH='Décroché';stP='Reprends contact avec ton manager'}

  // Header
  document.getElementById('h-name').textContent = nomSheet.charAt(0)+nomSheet.slice(1).toLowerCase();
  document.getElementById('h-boutique').textContent = boutique;
  document.getElementById('h-mois').textContent = moisLabel;
  document.getElementById('h-jour').textContent = `J${jourOuvre} / ${nbJours}`;
  document.getElementById('h-maj').textContent = majDate ? `MAJ ${majDate}` : 'En direct';

  // Items HTML
  const itemsHTML = itemsDefs.map(it => {
    const r = realMap[it.nomItem] || { real:0, proj:0, icon:'📊', unite:'' };
    const objVal = parseFloat(it.objectif) || 1;
    const p     = pct(r.real, objVal);
    const pProj = pct(r.proj, objVal);
    const projOk = r.proj >= objVal;
    const fmtV = val => it.unite === '%' || r.unite === '%' ? val+'%'
                      : it.unite?.includes('€') || r.unite?.includes('€') ? val+'€'
                      : ''+val;
    return `<div class="item-c ${projOk?'item-ok':'item-bad'}">
      <div class="ic-top">
        <span class="ic-icon">${r.icon}</span>
        <div>
          <span class="ic-pct-badge ${badgeClass(pProj)}">${projOk?'✓ ':''}${pProj}%</span>
          <div class="ic-proj-cap">proj. fin mois</div>
        </div>
      </div>
      <div class="ic-name">${it.nomItem}</div>
      <div class="prog-bg"><div class="prog-fill ${fillClass(pProj)}" style="width:${Math.min(pProj,100)}%"></div></div>
      <div class="ic-vals">
        <div class="iv"><span class="iv-l">Réalisé à date</span><span class="iv-r">${fmtV(r.real)}</span></div>
        <div class="iv"><span class="iv-l">Objectif</span><span class="iv-r" style="color:var(--muted)">${fmtV(objVal)}</span></div>
        <div class="iv"><span class="iv-l">Proj. fin mois</span><span class="iv-r ${projOk?'green':'red'}">${fmtV(r.proj)}</span></div>
      </div>
    </div>`;
  }).join('');

  // Malus expliqué
  const malusExplain = ratés === 0
    ? `<span style="color:var(--green-dk);font-weight:700">✓ Tous les items atteints — commission pleine !</span>`
    : `<span style="color:var(--sfr)">⚠️ ${ratés} item${ratés>1?'s':''} non atteint${ratés>1?'s':''} → malus de ${malusPct}%</span>`;

  // ── CHALLENGES ──
  // Challenges spécifiques manageurs/CDV : prime 20€/jour si seuil atteint
  const SPECIFIC_CHALLENGE = {
    'HASSENE':   { key:'Amboise_Won', title:'Challenge Amboise',  sub:'Marge boutique Amboise ≥ 700 €/jour → 20 €/jour',  failLabel:'✗ < 700 €' },
    'LOUANE':    { key:'Louane_Won',  title:'Challenge Cholet',   sub:'Marge boutique Cholet ≥ 1 000 €/jour → 20 €/jour', failLabel:'✗ < 1 000 €' },
    'ROMAIN GP': { key:'Groupe_Won',  title:'Challenge Groupe',   sub:'Marge groupe ≥ 4 000 €/jour → 20 €/jour',          failLabel:'✗ < 4 000 €' }
  };
  const specConfig = SPECIFIC_CHALLENGE[nomSheet.toUpperCase()];

  // Parsing mois en cours (format "mai 2026")
  const MOIS_NAMES = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
  const MOIS_DISP  = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const moisMatch = String(moisLabel).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').match(/(\w+)\s+(\d{4})/);
  const moisIdx  = moisMatch ? MOIS_NAMES.indexOf(moisMatch[1]) : new Date().getMonth();
  const anneeIdx = moisMatch ? parseInt(moisMatch[2])           : new Date().getFullYear();

  // Liste des mois disponibles dans Historique_Challenges (pour le sélecteur)
  const moisSet = new Set();

    const parts = String(d.Date || '').split('/');
    if (parts.length === 3) {
      const m = parseInt(parts[1]) - 1, y = parseInt(parts[2]);
      if (!isNaN(m) && !isNaN(y)) moisSet.add(m + '_' + y);
    }
  });
  const currentKey = moisIdx + '_' + anneeIdx;
  if (!moisSet.has(currentKey)) moisSet.add(currentKey); // toujours inclure mois en cours
  const moisDispo = [...moisSet].map(k => {
    const [m, y] = k.split('_').map(Number);
    return { m, y, label: MOIS_DISP[m] + ' ' + y, key: k };
  }).sort((a, b) => b.y - a.y || b.m - a.m);

  // Calcul stats pour un mois donné
  function challStatsFor(mArg, yArg) {
    const filtered = challenges.filter(d => {
      const parts = String(d.Date || '').split('/');
      if (parts.length !== 3) return false;

    let won = 0;

          hist.push({ date: d.Date || '', rank, won: hasWon });
        }
        if (hasWon) won++;
      });
    }
    return { won, total: filtered.length, hist, prime: won * 20 };
  }

  // Stats mois en cours (pour le Total estimé qui reste basé sur ce mois)
  const currentStats = challStatsFor(moisIdx, anneeIdx);
  const primeChallenge = currentStats.prime;
  const totalEstime = commNetteP + primeChallenge;

  const challTitle = specConfig ? specConfig.title : 'Challenge Vendeur';

  // Rend uniquement la partie body (stats + bar + hist + badge) — utilisée à l'init et au changement de mois

    return `

      <div class="chall-stats">
        <div class="chall-stat">
          <div class="chall-stat-val">${stats.won}</div>

        ${stats.hist.slice(-5).reverse().map(h => `
          <div class="chall-day">

            <span class="chall-day-badge ${h.won?'w':'l'}">${h.won?'✓ Gagné':(specConfig?specConfig.failLabel:'✗ < 400 €')}</span>
          </div>
        `).join('')}
      </div>` : '<div style="text-align:center;font-size:11px;color:var(--muted);padding:.5rem">Aucune participation enregistrée</div>'}
    `;
  }

    `<option value="${mo.m}_${mo.y}"${mo.m===moisIdx&&mo.y===anneeIdx?' selected':''}>${mo.label}</option>`
  ).join('');

  // Stash les helpers pour le handler onChange (attaché après innerHTML)
  window.__challStatsFor   = challStatsFor;
  window.__challRenderBody = renderChallBody;

  // Challenge HTML — affiché pour tous (Top 3 standard ou challenge spécifique)
  const challHTML = `
    <div class="sec">Challenge</div>
    <div class="chall-card">
      <div class="chall-hdr">
        <div class="chall-hdr-left">
          <span class="chall-icon">🏆</span>
          <div>

    </div>`;

  document.getElementById('dash-body').innerHTML = `

    <!-- Statut -->
    <div class="statut ${stClass}">
      <span class="st-icon">${stIcon}</span>
      <div class="st-txt"><h3>${stH}</h3><p>${stP}</p></div>
    </div>

    <div class="dash-cols">
    <div class="col-main">

    <!-- Commission hero -->
    <div class="comm-hero">
      <!-- Commission projetée (chiffre héros : ce que tu touches) -->
      <div class="comm-nette">
        <div class="cn-lbl">Commission projetée</div>
        <div class="cn-main">
          <div class="cn-val">${fmt(commNetteP)}<sup> €</sup></div>
          ${malusPct > 0 ? `<span class="cn-malus">-${malusPct}% · ${100-malusPct}% retenu</span>` : '<span class="cn-malus" style="background:rgba(0,166,81,.2);color:#86EFAC">✓ 100% retenu</span>'}
        </div>
        <div class="cn-sub" style="margin-top:8px;font-size:11px">
          ${malusExplain}
        </div>
        <div class="cn-sub" style="margin-top:4px">${fmt(commBrP)} € × ${100-malusPct}% (${5-ratés}/5 items) = <strong style="color:rgba(255,255,255,.7)">${fmt(commNetteP)} €</strong></div>
      </div>

      <!-- Marges (support) -->
      <div class="ch-grid" style="margin-top:.75rem;margin-bottom:0">
        <div class="ch-block">
          <div class="chb-lbl">Marge réalisée</div>
          <div class="chb-val">${fmt(marge)}<sup> €</sup></div>
          <div class="chb-sub">J${jourOuvre} · palier ${Math.round(palierActuel(marge).pct*100)}%</div>
        </div>
        <div class="ch-block proj">
          <div class="chb-lbl">Marge projetée</div>
          <div class="chb-val">${fmt(margeProj)}<sup> €</sup></div>
          <div class="chb-sub">Fin de mois · palier ${Math.round(palierP.pct*100)}%</div>
        </div>
      </div>

      ${primeChallenge > 0 ? `
      <!-- Total estimé (commission + challenge) -->
      <div class="total-estime">
        <div class="te-lbl">Total estimé (commission + challenge)</div>
        <div class="te-val">${fmt(totalEstime)}<sup> €</sup></div>
        <div class="te-detail">${fmt(commNetteP)} € commission + ${fmt(primeChallenge)} € challenge</div>
      </div>` : ''}
    </div>

    <!-- Palier -->
    <div class="palier-card">
      <div class="pc-top">
        <div>
          <div class="pc-tl">Palier de marge projeté</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${fmt(palierMin)} € → ${palierP.max===Infinity?'+9 000 €':fmt(palierMax)+' €'}</div>
        </div>
        <div class="pc-pct">${Math.round(palierP.pct*100)}%</div>
      </div>
      <div class="palier-bar-bg"><div class="palier-bar-fill" id="palier-bar" style="width:${progPalier}%"></div></div>
      <div class="palier-labels"><span>${fmt(palierMin)} €</span><span>${palierP.max===Infinity?'MAX':fmt(palierMax)+' €'}</span></div>
      ${next ? `
      <div class="palier-next">
        <div class="pn-txt">Encore <strong>${fmt(next.reste)} €</strong> de marge projetée pour atteindre le palier <strong>${Math.round(next.palier.pct*100)}%</strong></div>
      </div>` : `<div class="palier-next"><div class="pn-txt" style="color:var(--green-dk);font-weight:700">🏆 Palier maximum atteint !</div></div>`}
    </div>

    <!-- Présence -->
    <div class="pres-card">
      <div class="pres-row">
        <span class="pres-lbl">⏱️ Présence du mois</span>
        <span class="pres-val">${joursTrav}j</span>
      </div>
      <div class="pres-sub">sur ${nbJours} jours ouvrables · objectifs proratisés à ${Math.round(joursTrav/nbJours*100)}%</div>
      <div class="pres-bar"><div class="pres-fill" style="width:${Math.round(joursTrav/nbJours*100)}%"></div></div>
    </div>

    </div><!-- /col-main -->
    <div class="col-side">
    ${challHTML}
    </div><!-- /col-side -->
    </div><!-- /dash-cols -->

    <!-- 5 Items -->
    <div class="items-block">
    <div class="sec">Les 5 items — impact sur commission</div>
    <div style="background:#FFF8E1;border:1px solid #FDE68A;border-radius:12px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:12px;color:var(--amber);font-weight:600;line-height:1.5">
      ⚠️ Chaque item non atteint = <strong>-20%</strong> de commission.<br>5/5 atteints = commission pleine (${Math.round(palierP.pct*100)}% de ta marge projetée)
    </div>
    <div class="items-grid">${itemsHTML || '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:1rem;font-size:13px">Items en cours de chargement…</div>'}</div>
    </div><!-- /items-block -->

    <div class="refresh"><div class="live"></div>Google Sheet · ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>
  `;

  // Sélecteur de mois sur la carte Challenge — re-render le body avec le mois choisi
  const moisSelEl = document.getElementById('chall-mois-sel');
  if (moisSelEl && window.__challStatsFor && window.__challRenderBody) {
    moisSelEl.addEventListener('change', function(e){
      const parts = e.target.value.split('_').map(Number);
      const stats = window.__challStatsFor(parts[0], parts[1]);
      const body = document.getElementById('chall-body-inner');
      if (body) body.innerHTML = window.__challRenderBody(stats);
    });
  }

  showScreen('dash');
}
</script>
</body>
</html>

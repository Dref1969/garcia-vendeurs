<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mes Résultats · SFR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --sfr:#E2001A;--sfr2:#FF1A2E;--sfr-dark:#A8001A;
  --pro:#1A1A2E;--pro2:#252545;--pro3:#303060;
  --white:#FFFFFF;--off:#F5F5F5;--border:#E8E8E8;
  --text:#1A1A2E;--muted:#666;--light:#999;
  --green:#00A651;--green-bg:#E8F8F0;
  --orange:#F5A623;--orange-bg:#FFF4E0;
  --red:#E2001A;--red-bg:#FFF0F0;
  --safe-b:env(safe-area-inset-bottom,16px);
}
html,body{height:100%;background:var(--off);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;color:var(--text);overflow-x:hidden}

/* SCREENS */
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}

/* ── LOGIN ── */
#login{background:var(--pro);align-items:stretch;justify-content:flex-end}
.login-bg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.sfr-logo{width:72px;height:72px;background:var(--sfr);border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem}
.sfr-logo svg{width:44px;height:44px;fill:white}
.login-title{font-size:26px;font-weight:700;color:white;text-align:center;letter-spacing:-.5px}
.login-sub{font-size:13px;color:rgba(255,255,255,.4);text-align:center;margin-top:6px;letter-spacing:.3px}
.login-card{background:white;border-radius:28px 28px 0 0;padding:2rem 1.5rem calc(1.5rem + var(--safe-b))}
.field-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
.field-inp{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:17px;font-family:inherit;background:var(--off);color:var(--text);outline:none;transition:border-color .2s;margin-bottom:1.25rem}
.field-inp:focus{border-color:var(--sfr);background:white}
.pin-row{display:flex;gap:10px;margin-bottom:1.5rem}
.pin-d{flex:1;height:60px;border:1.5px solid var(--border);border-radius:12px;font-size:28px;font-weight:700;text-align:center;background:var(--off);color:var(--text);outline:none;transition:all .2s;-webkit-appearance:none}
.pin-d:focus{border-color:var(--sfr);border-width:2px;background:white}
.btn-login{width:100%;padding:17px;background:var(--sfr);color:white;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:.2px;transition:background .15s}
.btn-login:active{background:var(--sfr-dark)}
.err{margin-top:1rem;padding:12px 16px;background:var(--red-bg);color:var(--sfr);border-radius:10px;font-size:13px;text-align:center;display:none;font-weight:500}

/* ── HEADER ── */
.header{background:var(--sfr);padding:52px 1.25rem 1rem;position:sticky;top:0;z-index:10}
.header-row{display:flex;justify-content:space-between;align-items:flex-start}
.h-greeting{font-size:22px;font-weight:700;color:white;letter-spacing:-.3px}
.h-info{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px;font-weight:500}
.h-logout{background:rgba(255,255,255,.15);border:none;color:white;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.h-date-pill{display:inline-block;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 12px;font-size:11px;color:rgba(255,255,255,.8);font-weight:600;letter-spacing:.5px;margin-top:10px}

/* ── SCROLL BODY ── */
.body{flex:1;overflow-y:auto;padding:.75rem .75rem calc(1rem + var(--safe-b))}

/* ── CARDS ── */
.card{background:white;border-radius:16px;margin-bottom:.75rem;overflow:hidden;border:1px solid var(--border)}

/* ── MARGE HERO ── */
.marge-hero{background:var(--pro);border-radius:16px;padding:1.25rem;margin-bottom:.75rem}
.marge-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.marge-block{background:var(--pro2);border-radius:12px;padding:1rem}
.mb-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:6px}
.mb-val{font-size:28px;font-weight:800;color:white;letter-spacing:-1px;line-height:1}
.mb-val sup{font-size:14px;font-weight:400;opacity:.6}
.mb-delta{font-size:11px;margin-top:6px;font-weight:600}
.delta-up{color:#4EC07F}
.delta-down{color:#FF6B6B}
.delta-flat{color:rgba(255,255,255,.4)}

/* ── SECTION TITLE ── */
.sec{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:.75rem .25rem .4rem}

/* ── ITEMS GRID ── */
.items-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem}
.item-card{background:white;border:1px solid var(--border);border-radius:14px;padding:.9rem}
.ic-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.ic-icon{font-size:18px;line-height:1}
.ic-pct{font-size:15px;font-weight:800;padding:3px 8px;border-radius:8px}
.pct-great{background:#FFF4CC;color:#B8860B}
.pct-ok{background:#E8F8F0;color:#006633}
.pct-warn{background:#FFF4E0;color:#CC6600}
.pct-bad{background:#FFF0F0;color:#CC0011}
.ic-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-bottom:.4rem}
.ic-vals{display:flex;flex-direction:column;gap:3px}
.iv-row{display:flex;justify-content:space-between;align-items:center}
.iv-lbl{font-size:10px;color:var(--light)}
.iv-val{font-size:13px;font-weight:700;color:var(--text)}
.iv-proj{font-size:11px;font-weight:600;color:var(--sfr)}
.prog-bg{height:4px;background:var(--border);border-radius:10px;margin:.5rem 0 .3rem;overflow:hidden}
.prog-fill{height:100%;border-radius:10px;transition:width .8s}
.fill-great{background:#F5A623}
.fill-ok{background:#00A651}
.fill-warn{background:#F5A623}
.fill-bad{background:#E2001A}

/* ── DETAIL COMMISSIONS ── */
.comm-row{display:flex;justify-content:space-between;align-items:center;padding:11px 1rem;border-bottom:1px solid var(--border)}
.comm-row:last-child{border-bottom:none}
.cr-name{font-size:13px;color:var(--text)}
.cr-val{font-size:13px;font-weight:700;color:var(--text)}
.comm-total{background:var(--pro);padding:12px 1rem}
.ct-name{font-size:12px;color:rgba(255,255,255,.6)}
.ct-val{font-size:18px;font-weight:800;color:white}
.comm-proj-row{background:var(--red-bg);padding:11px 1rem;border-top:1px solid #FFD0D0}
.cpr-name{font-size:12px;color:var(--sfr);font-weight:600}
.cpr-val{font-size:16px;font-weight:800;color:var(--sfr)}

/* ── STATUT ── */
.statut-banner{border-radius:14px;padding:12px 1rem;margin-bottom:.75rem;display:flex;align-items:center;gap:10px}
.sb-great{background:linear-gradient(135deg,#006633,#00A651);color:white}
.sb-ok{background:linear-gradient(135deg,#004D99,#0066CC);color:white}
.sb-warn{background:linear-gradient(135deg,#996600,#CC8800);color:white}
.sb-bad{background:linear-gradient(135deg,#990011,#CC0011);color:white}
.sb-icon{font-size:24px;flex-shrink:0}
.sb-title{font-size:15px;font-weight:800;letter-spacing:-.2px}
.sb-sub{font-size:11px;opacity:.8;margin-top:2px}

/* ── PRÉSENCE ── */
.pres-card{background:white;border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center}
.pc-left{font-size:13px;color:var(--muted)}
.pc-left b{display:block;font-size:15px;color:var(--text);margin-bottom:2px}
.pc-right{text-align:right}
.pc-jours{font-size:28px;font-weight:800;color:var(--pro);line-height:1}
.pc-sub{font-size:11px;color:var(--muted)}
.pc-bar{height:5px;background:var(--border);border-radius:10px;margin-top:.75rem;overflow:hidden}
.pc-fill{height:100%;background:var(--sfr);border-radius:10px}

/* ── REFRESH ── */
.refresh{text-align:center;padding:1rem;font-size:11px;color:var(--light);display:flex;align-items:center;justify-content:center;gap:6px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>

<!-- ════════════════ LOGIN ════════════════ -->
<div id="login" class="screen active">
  <div class="login-bg">
    <div class="sfr-logo">
      <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <text x="4" y="46" font-size="46" font-weight="900" fill="white">SFR</text>
      </svg>
    </div>
    <div class="login-title">Mes Résultats</div>
    <div class="login-sub">Groupe Garcia · Avril 2026</div>
  </div>
  <div class="login-card">
    <span class="field-lbl">Prénom</span>
    <input class="field-inp" type="text" id="inp-prenom" placeholder="Ton prénom" autocomplete="off" autocapitalize="words" />
    <span class="field-lbl">Code d'accès</span>
    <div class="pin-row">
      <input class="pin-d" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
      <input class="pin-d" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
      <input class="pin-d" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
      <input class="pin-d" maxlength="1" inputmode="numeric" pattern="[0-9]*" />
    </div>
    <button class="btn-login" onclick="tryLogin()">Accéder →</button>
    <div class="err" id="err">Prénom ou code incorrect</div>
  </div>
</div>

<!-- ════════════════ DASHBOARD ════════════════ -->
<div id="dash" class="screen">
  <div class="header">
    <div class="header-row">
      <div>
        <div class="h-greeting" id="h-name">—</div>
        <div class="h-info" id="h-boutique">—</div>
      </div>
      <button class="h-logout" onclick="doLogout()">Déco</button>
    </div>
    <div class="h-date-pill">AVRIL 2026 · J<span id="h-jour">1</span>/22</div>
  </div>
  <div class="body" id="dash-body"></div>
</div>

<script>
/* ═══════════ DONNÉES 3GWIN — 01/04/2026 ═══════════
   Mapping depuis SKILL.md + données scraped
   ═══════════════════════════════════════════════════ */
const JOUR_EN_COURS = 1;
const JOURS_MOIS = 22;

// Objectifs base mois complet (22j)
const OBJ = { mob:20, g3a:0.5, cyber:15, assuTx:40, accMt:30 };

const VENDEURS = {
  'anais':   { pin:'7342', boutique:'CHOLET',        jours:19, mob:0,  g3a:0,  cyber:0, assuTx:0,    accMt:0,     marge:0      },
  'axel':    { pin:'5819', boutique:'ALR · ANGERS',  jours:22, mob:0,  g3a:0,  cyber:0, assuTx:0,    accMt:0,     marge:0      },
  'chloe':   { pin:'2967', boutique:'CHOLET',        jours:11, mob:0,  g3a:0,  cyber:0, assuTx:0,    accMt:1.36,  marge:161.36 },
  'emilie':  { pin:'8403', boutique:'RLR · ROMORANTIN', jours:20, mob:1, g3a:1, cyber:0, assuTx:200,  accMt:29.76, marge:208.18 },
  'emmy':    { pin:'4651', boutique:'CHOLET',        jours:6,  mob:0,  g3a:0,  cyber:0, assuTx:0,    accMt:0,     marge:0      },
  'hassene': { pin:'9274', boutique:'TLR · AMBOISE', jours:22, mob:3,  g3a:3,  cyber:2, assuTx:133,  accMt:55.82, marge:964.45 },
  'ilian':   { pin:'3586', boutique:'CLR · CHÂTEAUDUN', jours:13, mob:3, g3a:1, cyber:2, assuTx:33,  accMt:26.48, marge:333.39 },
  'julie':   { pin:'6038', boutique:'TLR · AMBOISE', jours:10, mob:0,  g3a:0,  cyber:0, assuTx:0,    accMt:0,     marge:0      },
  'louane':  { pin:'1847', boutique:'CHOLET',        jours:21, mob:0,  g3a:0,  cyber:0, assuTx:0,    accMt:0,     marge:0      },
  'lucas':   { pin:'7520', boutique:'CHOLET',        jours:21, mob:0,  g3a:0,  cyber:1, assuTx:0,    accMt:0,     marge:103.83 },
  'mehdy':   { pin:'4913', boutique:'VLR · VENDÔME', jours:22, mob:1,  g3a:0,  cyber:0, assuTx:100,  accMt:5.35,  marge:306.68 },
  'nathan':  { pin:'8261', boutique:'RLR · ROMORANTIN', jours:13, mob:0, g3a:0, cyber:0, assuTx:0,   accMt:0,     marge:0      },
  'pauline': { pin:'3074', boutique:'ALR · ANGERS',  jours:17, mob:1,  g3a:0,  cyber:0, assuTx:0,    accMt:46.93, marge:67.76  },
  'rachel':  { pin:'6425', boutique:'CLR · CHÂTEAUDUN', jours:9, mob:1, g3a:1,  cyber:0, assuTx:0,   accMt:28.64, marge:88.64  },
  'will':    { pin:'9130', boutique:'RLR · ROMORANTIN', jours:22, mob:2, g3a:1, cyber:0, assuTx:0,   accMt:25.88, marge:113.42 },
};

/* ═══════════ AUTH ═══════════ */
const pins = [...document.querySelectorAll('.pin-d')];
pins.forEach((p,i) => {
  p.addEventListener('input', () => {
    p.value = p.value.replace(/\D/,'');
    if (p.value && i < 3) pins[i+1].focus();
    if (i === 3 && p.value) tryLogin();
  });
  p.addEventListener('keydown', e => {
    if (e.key==='Backspace' && !p.value && i>0) { pins[i-1].focus(); pins[i-1].value=''; }
  });
});
document.getElementById('inp-prenom').addEventListener('keydown', e => { if(e.key==='Enter') pins[0].focus(); });

function normalize(s){ return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function getPin(){ return pins.map(p=>p.value).join(''); }

function tryLogin(){
  const prenom = normalize(document.getElementById('inp-prenom').value);
  const pin = getPin();
  const v = VENDEURS[prenom];
  const err = document.getElementById('err');
  if(v && v.pin===pin){
    err.style.display='none';
    renderDash(prenom);
    document.getElementById('login').classList.remove('active');
    document.getElementById('dash').classList.add('active');
  } else {
    err.style.display='block';
    pins.forEach(p=>p.value='');
    pins[0].focus();
  }
}

function doLogout(){
  document.getElementById('dash').classList.remove('active');
  document.getElementById('login').classList.add('active');
  document.getElementById('inp-prenom').value='';
  pins.forEach(p=>p.value='');
}

/* ═══════════ CALCULS ═══════════ */
function objProrata(jours){
  const r = jours / JOURS_MOIS;
  return { mob:Math.round(OBJ.mob*r*10)/10, g3a:OBJ.g3a, cyber:Math.round(OBJ.cyber*r*10)/10, assuTx:OBJ.assuTx, accMt:OBJ.accMt };
}

function projeter(v){
  // projection linéaire sur jours présence
  const r = JOUR_EN_COURS > 0 ? v.jours / JOUR_EN_COURS : 1;
  return {
    mob:    Math.round(v.mob    * r),
    g3a:    v.mob>0 ? Math.round(v.mob*r) > 0 ? parseFloat((v.g3a).toFixed(2)) : 0 : 0,
    cyber:  Math.round(v.cyber  * r),
    assuTx: v.assuTx, // taux pas projeté
    accMt:  Math.round(v.accMt * 10) / 10,
    marge:  Math.round(v.marge * r),
  };
}

function pct(real, obj){ return obj>0 ? Math.min(Math.round(real/obj*100),200) : (real>0?100:0); }

function calcComm(v, obj){
  // Commission sur réalisé
  const mobComm  = v.mob * 30;
  const g3aComm  = Math.round(v.mob * v.g3a) * 15;
  const cyberComm= v.cyber * 8;
  const assuBonus= v.assuTx >= 40 ? 200 : v.assuTx >= 25 ? 80 : 0;
  const accComm  = v.mob > 0 ? Math.round(v.accMt * v.mob * 0.4) : 0;
  const base = mobComm + g3aComm + cyberComm + assuBonus + accComm;
  return { mobComm, g3aComm, cyberComm, assuBonus, accComm, total:base };
}

/* ═══════════ RENDER ═══════════ */
function pctClass(p){ return p>=100?'pct-great':p>=75?'pct-ok':p>=50?'pct-warn':'pct-bad'; }
function fillClass(p){ return p>=100?'fill-great':p>=75?'fill-ok':p>=50?'fill-warn':'fill-bad'; }
function fmt(n){ return n.toLocaleString('fr-FR'); }

function renderDash(key){
  const v = VENDEURS[key];
  const nom = key.charAt(0).toUpperCase()+key.slice(1);
  document.getElementById('h-name').textContent = nom;
  document.getElementById('h-boutique').textContent = v.boutique;
  document.getElementById('h-jour').textContent = JOUR_EN_COURS;

  const obj  = objProrata(v.jours);
  const proj = projeter(v);
  const commR = calcComm(v, obj);
  const commP = calcComm({...v, mob:proj.mob, g3a:v.g3a, cyber:proj.cyber, assuTx:v.assuTx, accMt:v.accMt}, obj);

  // Statut global
  const pcts5 = [pct(v.mob,obj.mob), pct(v.g3a,obj.g3a), pct(v.cyber,obj.cyber), pct(v.assuTx,obj.assuTx), pct(v.accMt,obj.accMt)];
  const avg = Math.round(pcts5.reduce((a,b)=>a+b,0)/5);
  let sbClass, sbIcon, sbTitle, sbSub;
  if(avg>=100){sbClass='sb-great';sbIcon='🏆';sbTitle='Objectifs atteints !';sbSub='Continue comme ça, tu es au top'}
  else if(avg>=75){sbClass='sb-ok';sbIcon='✅';sbTitle='En bonne voie';sbSub='Maintiens ce rythme jusqu\'à la fin du mois'}
  else if(avg>=40){sbClass='sb-warn';sbIcon='⚡';sbTitle='À accélérer';sbSub='Il reste du temps — force !'}
  else{sbClass='sb-bad';sbIcon='🚨';sbTitle='Décroché';sbSub='Reprends contact avec ton manager'}

  const items = [
    { icon:'📱', label:'Mobiles',        real:v.mob,    proj:proj.mob,   obj:obj.mob,   fmtR:v=>v+'',     fmtP:v=>v+'',     fmtO:v=>v.toFixed(0) },
    { icon:'🛡️', label:'Garantie 3ème A.', real:Math.round(v.mob*v.g3a), proj:Math.round(proj.mob*v.g3a), obj:Math.round(obj.mob*obj.g3a), fmtR:v=>v+'', fmtP:v=>v+'', fmtO:v=>v.toFixed(0) },
    { icon:'🔒', label:'SFR Cyber',       real:v.cyber,  proj:proj.cyber, obj:obj.cyber, fmtR:v=>v+'',     fmtP:v=>v+'',     fmtO:v=>v.toFixed(0) },
    { icon:'⚡', label:"Tx Assurance",   real:v.assuTx, proj:v.assuTx,   obj:obj.assuTx,fmtR:v=>v+'%',   fmtP:v=>v+'%',   fmtO:v=>v+'%' },
    { icon:'🎧', label:"Accessoires",    real:v.accMt,  proj:v.accMt,    obj:obj.accMt, fmtR:v=>v+'€',   fmtP:v=>v+'€',   fmtO:v=>v+'€' },
  ];

  document.getElementById('dash-body').innerHTML = `

    <!-- Statut -->
    <div class="statut-banner ${sbClass}">
      <span class="sb-icon">${sbIcon}</span>
      <div><div class="sb-title">${sbTitle}</div><div class="sb-sub">${sbSub}</div></div>
    </div>

    <!-- Marge -->
    <div class="marge-hero">
      <div class="marge-grid">
        <div class="marge-block">
          <div class="mb-lbl">Marge réalisée</div>
          <div class="mb-val">${fmt(Math.round(v.marge))}<sup> €</sup></div>
          <div class="mb-delta delta-flat" style="color:rgba(255,255,255,.4);font-size:10px">Aujourd'hui J${JOUR_EN_COURS}</div>
        </div>
        <div class="marge-block" style="border:1px solid rgba(226,0,26,.4)">
          <div class="mb-lbl" style="color:rgba(255,100,100,.7)">Projection fin mois</div>
          <div class="mb-val" style="color:#FF8080">${fmt(commP.total)}<sup> €</sup></div>
          <div class="mb-delta ${commP.total>commR.total?'delta-up':'delta-flat'}" style="font-size:10px">Commission estimée</div>
        </div>
      </div>
    </div>

    <!-- Présence -->
    <div class="pres-card">
      <div>
        <b>Présence du mois</b>
        <div class="pc-left">Objectifs proratisés à ${Math.round(v.jours/JOURS_MOIS*100)}%</div>
        <div class="pc-bar" style="width:160px;margin-top:.5rem"><div class="pc-fill" style="width:${Math.round(v.jours/JOURS_MOIS*100)}%"></div></div>
      </div>
      <div class="pc-right">
        <div class="pc-jours">${v.jours}j</div>
        <div class="pc-sub">sur ${JOURS_MOIS} jours</div>
      </div>
    </div>

    <!-- 5 Items -->
    <div class="sec">Les 5 items payplan</div>
    <div class="items-grid">
      ${items.map((it,i) => {
        const p = pct(it.real, it.obj);
        return `<div class="item-card">
          <div class="ic-top">
            <span style="font-size:20px">${it.icon}</span>
            <span class="ic-pct ${pctClass(p)}">${p}%</span>
          </div>
          <div class="ic-label">${it.label}</div>
          <div class="prog-bg"><div class="prog-fill ${fillClass(p)}" style="width:${Math.min(p,100)}%"></div></div>
          <div class="ic-vals">
            <div class="iv-row"><span class="iv-lbl">Réalisé</span><span class="iv-val">${it.fmtR(it.real)}</span></div>
            <div class="iv-row"><span class="iv-lbl">Objectif</span><span class="iv-val" style="color:var(--muted)">${it.fmtO(it.obj)}</span></div>
            <div class="iv-row"><span class="iv-lbl">Proj. fin mois</span><span class="iv-proj">${it.fmtP(it.proj)}</span></div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Détail commissions -->
    <div class="sec">Détail commissions</div>
    <div class="card">
      <div class="comm-row"><span class="cr-name">📱 Mobiles (${v.mob} × 30€)</span><span class="cr-val">${commR.mobComm} €</span></div>
      <div class="comm-row"><span class="cr-name">🛡️ G3A (${Math.round(v.mob*v.g3a)} × 15€)</span><span class="cr-val">${commR.g3aComm} €</span></div>
      <div class="comm-row"><span class="cr-name">🔒 SFR Cyber (${v.cyber} × 8€)</span><span class="cr-val">${commR.cyberComm} €</span></div>
      <div class="comm-row"><span class="cr-name">⚡ Bonus assurance (${v.assuTx}%)</span><span class="cr-val">${commR.assuBonus} €</span></div>
      <div class="comm-row"><span class="cr-name">🎧 Accessoires marge</span><span class="cr-val">${commR.accComm} €</span></div>
      <div class="comm-total" style="display:flex;justify-content:space-between;align-items:center">
        <span class="ct-name">Commission actuelle</span><span class="ct-val">${commR.total} €</span>
      </div>
      <div class="comm-proj-row" style="display:flex;justify-content:space-between;align-items:center">
        <span class="cpr-name">🎯 Projection fin de mois</span><span class="cpr-val">${commP.total} €</span>
      </div>
    </div>

    <div class="refresh"><div class="live-dot"></div>Données 3GWIN · ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} à ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>
  `;
}
</script>
</body>
</html>
